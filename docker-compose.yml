# Runs the whole stack locally: MySQL with seed data, the API and the dashboard.
#   docker compose up --build
# Dashboard: http://localhost:3000   API: http://localhost:5001   MySQL: localhost:3307
#
# The database password below is only for this local container. Override it with
# DB_PASSWORD in a root .env file; never reuse a real password here.

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: NFT_Theft_Database
      MYSQL_USER: nft
      MYSQL_PASSWORD: ${DB_PASSWORD:-nft_local_only}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
      # Runs once, in name order, when the volume is empty.
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
      - ./database/03_bulk_data.sql:/docker-entrypoint-initdb.d/03_bulk_data.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -unft -p\"$$MYSQL_PASSWORD\" -e 'SELECT COUNT(*) FROM NFT_Theft_Database.PLATFORM_REPORTS'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: nft
      DB_PASSWORD: ${DB_PASSWORD:-nft_local_only}
      DB_NAME: NFT_Theft_Database
      PORT: 5001
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5001
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

volumes:
  db-data:
